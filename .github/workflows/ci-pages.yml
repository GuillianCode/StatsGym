name: Vérification React et démo GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify_react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: https://eu.i.posthog.com
  deploy_static_demo:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configurer l'endpoint du questionnaire
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          node -e "const fs=require('fs'); const url=process.env.SUPABASE_URL; if (!url) throw new Error('La variable VITE_SUPABASE_URL est requise pour publier le questionnaire.'); const endpoint=url.replace(/\\/$/, '') + '/functions/v1/submit-survey'; fs.writeFileSync('published-demo/runtime-config.js', 'window.STATSGYM_CONFIG = Object.freeze({surveyEndpoint: ' + JSON.stringify(endpoint) + '});\\n');"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: published-demo
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
